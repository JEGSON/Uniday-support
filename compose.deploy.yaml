# Run only with: docker compose -p unidays-stage7 --profile dev -f compose.deploy.yaml ...
# This project has its own MongoDB volume, distinct from the existing local demo.
services:
  mongodb:
    image: mongo:8.0
    env_file: .env.deploy.mongo
    volumes:
      - stage7_mongo:/data/db
      - ./deploy/mongo-init.js:/docker-entrypoint-initdb.d/01-users.js:ro
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'quit(db.getSiblingDB(\"admin\").auth(process.env.MONGO_INITDB_ROOT_USERNAME, process.env.MONGO_INITDB_ROOT_PASSWORD) ? 0 : 1)' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 24
      start_period: 30s
  mailpit:
    image: axllent/mailpit:v1.22.3
    profiles: [dev]
    ports: ["127.0.0.1:18025:8025"]
    networks: [backend, frontend]
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 6
  app:
    build: .
    env_file: .env.deploy.app
    depends_on:
      mongodb:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    networks: [backend]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
  registry-importer:
    image: unidays-stage7-app:latest
    profiles: [tools]
    env_file: .env.deploy.importer
    depends_on:
      mongodb:
        condition: service_healthy
    networks: [backend]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    volumes:
      - ./data/examples/student_registry.example.csv:/input/registry.csv:ro
    entrypoint: ["python", "-m", "scripts.seed_registry", "/input/registry.csv"]
    command: ["--dry-run"]
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      app:
        condition: service_healthy
    ports: ["127.0.0.1:5443:443"]
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    networks: [backend, frontend]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --no-check-certificate -O /dev/null https://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
networks:
  backend:
    internal: true
  frontend:
volumes:
  stage7_mongo:
