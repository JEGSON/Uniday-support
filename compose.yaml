services:
  mailpit:
    image: axllent/mailpit:v1.22.3
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
  mongodb:
    image: mongo:8.0
    env_file:
      - .env.mongo
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data:
