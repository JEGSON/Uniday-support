{% extends 'base.html' %}
{% block title %}Request a verification link · Unidays Support{% endblock %}
{% block styles %}<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">{% endblock %}
{% block content %}
<div class="auth-page"><section class="auth-card glass">
  <h1>Request a verification link</h1>
  {% if notice %}<div class="form-alert" role="status">{{ notice }}</div>{% endif %}
  <form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field"><label for="email">University email</label><input id="email" name="email" type="email" autocomplete="email" required></div>
    <button class="button button-wide" type="submit">Request link</button>
  </form>
</section></div>
{% endblock %}
